name: Despliegue Automático (GitHub Pages & Supabase)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    name: Despliegue de Aplicación Web
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # 1. Sincronización de Base de Datos en Supabase (Opcional si existe secreto)
      # ------------------------------------------------------------------------
      - name: Sincronizar Esquema en Supabase
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "Secreto SUPABASE_DB_URL no configurado todavía. Omitiendo sincronización de base de datos."
            exit 0
          fi
          echo "Conectando a Supabase PostgreSQL y aplicando schema.sql..."
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "$DB_URL" -f supabase/schema.sql
          echo "¡Base de datos en Supabase sincronizada con éxito!"

      # ------------------------------------------------------------------------
      # 2. Compilación del Frontend (React + Vite)
      # ------------------------------------------------------------------------
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar proyecto frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # ------------------------------------------------------------------------
      # 3. Publicación en GitHub Pages
      # ------------------------------------------------------------------------
      - name: Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Desplegar sitio web
        id: deployment
        uses: actions/deploy-pages@v4
